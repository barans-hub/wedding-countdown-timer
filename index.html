<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Days until Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f9f8f7;
    --text-dark: #37352f;
    --text-muted: #9b9a97;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'PT Serif', Georgia, 'Times New Roman', serif;
    color: var(--text-dark);
  }

  .widget {
    position: relative;
    width: 100%;
    margin: 0 auto;
    padding: 28px 20px;
    background: var(--bg);
    border-radius: 6px;
    text-align: center;
  }

  .display-view {
    visibility: visible;
  }

  .display-view.dimmed {
    visibility: hidden;
  }

  .label {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text-dark);
    letter-spacing: 0.1px;
  }

  .days-number {
    font-size: 34px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--text-dark);
    font-variant-numeric: lining-nums;
  }

  .gear-btn {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .widget:hover .gear-btn {
    opacity: 1;
  }

  .gear-btn:hover {
    background: rgba(0,0,0,0.06);
    color: var(--text-dark);
  }

  .setup-panel {
    position: absolute;
    inset: 0;
    background: var(--bg);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .setup-panel.hidden {
    display: none;
  }

  .setup-hint {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }

  input[type="date"] {
    font-family: 'PT Serif', Georgia, 'Times New Roman', serif;
    font-size: 15px;
    padding: 7px 10px;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 6px;
    background: #fff;
    color: var(--text-dark);
  }

  .save-btn {
    font-family: 'PT Serif', Georgia, 'Times New Roman', serif;
    font-size: 14px;
    font-weight: 500;
    padding: 7px 16px;
    border: 1px solid var(--text-dark);
    border-radius: 6px;
    background: var(--text-dark);
    color: #fff;
    cursor: pointer;
  }

  .save-btn:hover {
    opacity: 0.9;
  }

  .error-msg {
    font-size: 12px;
    color: #a13d2c;
    margin: 0;
    min-height: 14px;
  }
</style>
</head>
<body>

  <div class="widget">
    <button id="gearBtn" class="gear-btn" title="Change wedding date" aria-label="Change wedding date">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>

    <div id="displayView" class="display-view">
      <p class="label">Days to go</p>
      <div class="days-number" id="daysNumber">—</div>
    </div>

    <div id="setupPanel" class="setup-panel hidden">
      <p class="setup-hint">Set your wedding date</p>
      <input id="dateInput" type="date" />
      <button id="saveBtn" class="save-btn" type="button">Save</button>
      <p id="errorMsg" class="error-msg"></p>
    </div>
  </div>

<script>
(function () {
  const STORAGE_KEY = "weddingDateISO";
  const dateInput   = document.getElementById("dateInput");
  const daysNumber  = document.getElementById("daysNumber");
  const displayView = document.getElementById("displayView");
  const saveBtn     = document.getElementById("saveBtn");
  const gearBtn     = document.getElementById("gearBtn");
  const setupPanel  = document.getElementById("setupPanel");
  const errorMsg    = document.getElementById("errorMsg");

  function parseISODateOnlyToUTC(isoDateOnly) {
    const [y, m, d] = isoDateOnly.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d, 0, 0, 0));
  }

  function todayUTCStart() {
    const now = new Date();
    return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0, 0, 0));
  }

  function updateCountdown(iso) {
    if (!iso) {
      daysNumber.textContent = "—";
      return;
    }
    const target = parseISODateOnlyToUTC(iso);
    const today = todayUTCStart();
    const msPerDay = 24 * 60 * 60 * 1000;
    const diffDays = Math.round((target - today) / msPerDay);
    daysNumber.textContent = diffDays >= 0 ? diffDays : Math.abs(diffDays);
  }

  function showSetup() {
    setupPanel.classList.remove("hidden");
    displayView.classList.add("dimmed");
    errorMsg.textContent = "";
  }

  function showDisplay() {
    setupPanel.classList.add("hidden");
    displayView.classList.remove("dimmed");
  }

  function init() {
    let saved = null;
    try {
      saved = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      saved = null;
    }

    if (saved) {
      dateInput.value = saved;
      updateCountdown(saved);
      showDisplay();
    } else {
      showSetup();
    }
  }

  saveBtn.addEventListener("click", () => {
    if (!dateInput.value) {
      errorMsg.textContent = "Please pick a date.";
      return;
    }
    try {
      localStorage.setItem(STORAGE_KEY, dateInput.value);
    } catch (e) {
      errorMsg.textContent = "Could not save the date.";
      return;
    }
    updateCountdown(dateInput.value);
    showDisplay();
  });

  gearBtn.addEventListener("click", () => {
    if (setupPanel.classList.contains("hidden")) {
      showSetup();
    } else {
      showDisplay();
    }
  });

  init();
  setInterval(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) updateCountdown(saved);
    } catch (e) {}
  }, 60 * 1000);
})();
</script>

</body>
</html>
